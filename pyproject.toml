[project]
name = "sca-monitor"
version = "0.1.0"
description = "Reported supply chain advisory monitoring MVP"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "cryptography>=41",
    "packaging>=23",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["deploy*", "harness*", "frontend*", "migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
