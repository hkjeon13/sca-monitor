<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCA Monitor · 프로젝트 보안</title>
    <link rel="stylesheet" href="/styles.css?v=20261028-search-index" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen" hidden>
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">◆</div>
          <div>
            <strong>SCA MONITOR</strong><span>PROJECT SECURITY WORKSPACE</span>
          </div>
        </div>
        <h1 id="auth-title">로그인</h1>
        <p id="auth-description">프로젝트의 패키지와 보안 영향을 확인하세요.</p>
        <form id="auth-form">
          <label id="display-name-field" hidden
            >이름<input name="display_name" autocomplete="name" maxlength="100"
          /></label>
          <label
            >이메일<input
              name="email"
              type="email"
              autocomplete="username"
              required
              maxlength="254"
          /></label>
          <label
            >비밀번호<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="256"
          /></label>
          <p id="password-hint" hidden>
            비밀번호는 12자 이상으로 설정해 주세요.
          </p>
          <button type="submit" id="auth-submit">로그인</button>
        </form>
        <p id="auth-error" class="form-error" role="alert"></p>
        <p class="auth-footnote">
          계정이 없거나 비밀번호를 잊었다면 관리자에게 계정 설정 링크를
          요청하세요.
        </p>
      </div>
    </div>
    <div class="app" id="console" hidden>
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">◆</div>
          <div><strong>SCA MONITOR</strong><span>PROJECT SECURITY</span></div>
        </div>
        <p class="nav-label">WORKSPACE</p>
        <nav aria-label="주 메뉴">
          <a href="#overview"
            ><span class="nav-icon" aria-hidden="true">▦</span>Overview</a
          >
          <a href="#projects"
            ><span class="nav-icon" aria-hidden="true">◈</span>프로젝트</a
          >
          <a href="#intel"
            ><span class="nav-icon" aria-hidden="true">⌕</span>보안 정보 탐색</a
          >
          <a href="#findings"
            ><span class="nav-icon" aria-hidden="true">△</span>영향 및 조치</a
          >
          <a href="#alerts"
            ><span class="nav-icon" aria-hidden="true">♧</span>알림</a
          >
          <a href="#guide"
            ><span class="nav-icon" aria-hidden="true">⌁</span>연동 가이드</a
          >
          <a href="#operations"
            ><span class="nav-icon" aria-hidden="true">⚙</span>수집·계정
            관리</a
          >
        </nav>
        <div class="sidebar-status">
          <span class="status-dot"></span
          ><span id="sidebar-caption">프로젝트 보안 모니터링</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <span class="eyebrow">SUPPLY CHAIN SECURITY / WORKSPACE</span>
            <h1 id="view-title">Overview</h1>
            <p id="view-subtitle"></p>
          </div>
          <div class="top-actions">
            <label class="scope-label"
              >프로젝트 범위<select
                id="project-scope"
                aria-label="프로젝트 범위"
              >
                <option value="">내 전체 프로젝트</option>
              </select></label
            ><button id="refresh" type="button" aria-label="새로고침">↻</button>
          </div>
        </header>
        <div class="account-bar">
          <span id="account-name"></span
          ><button type="button" class="text-button" id="logout">
            로그아웃
          </button>
        </div>
        <div id="page" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="detail-dialog">
      <div class="dialog-heading">
        <h2 id="detail-title">상세</h2>
        <button
          type="button"
          id="close-dialog"
          class="secondary"
          aria-label="상세 닫기"
        >
          ✕
        </button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <div id="info-popover" class="info-popover" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="/app.js?v=20261028-search-index"></script>
  </body>
</html>
